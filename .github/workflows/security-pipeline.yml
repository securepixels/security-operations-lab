name: Security Pipeline - Scan, Lint, Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform-checks:
    name: Terraform Validation & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init
        run: |
          cd terraform/environments/homelab
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform/environments/homelab
          terraform validate

      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec (Terraform Security Scanner)
        run: |
          tfsec terraform/ --format json --out tfsec-results.json || true
          tfsec terraform/ --format lovely

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov (IaC Policy Scanner)
        run: |
          checkov -d terraform/ --output json > checkov-results.json || true
          checkov -d terraform/ --compact

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-security-scans
          path: |
            tfsec-results.json
            checkov-results.json

  python-checks:
    name: Python Lint & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit pyyaml requests

      - name: Lint Python scripts
        run: |
          flake8 scripts/ --max-line-length 120 --statistics

      - name: Security scan Python code
        run: |
          bandit -r scripts/ -ll --format json --output bandit-results.json || true
          bandit -r scripts/ -ll

      - name: Upload Python security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-scans
          path: bandit-results.json

  wazuh-rules-validation:
    name: Wazuh Rules XML Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Wazuh Rules XML
        run: |
          echo "Validating Wazuh rules XML syntax..."
          for file in rules/wazuh/*.xml; do
            if [ -f "$file" ]; then
              python3 -c "
          import xml.etree.ElementTree as ET
          try:
              ET.parse('$file')
              print('  PASS: $file')
          except ET.ParseError as e:
              print('  FAIL: $file -', e)
              exit(1)
          "
            fi
          done
          echo "All rules files are valid XML."

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (Secrets Scanner)
        run: |
          gitleaks detect --source . --verbose --report-format json --report-path gitleaks-results.json || true

      - name: Upload secrets scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan
          path: gitleaks-results.json

  scan-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [terraform-checks, python-checks, wazuh-rules-validation, secrets-scan]
    if: always()

    steps:
      - name: Pipeline Status
        run: |
          echo "========================================"
          echo "  Security Pipeline Complete"
          echo "========================================"
          echo ""
          echo "  Terraform: format, validate, tfsec, checkov"
          echo "  Python: flake8 lint, bandit security scan"
          echo "  Wazuh: XML syntax validation"
          echo "  Secrets: gitleaks detection"
          echo ""
          echo "  Check artifacts for detailed scan results."
          echo "========================================"
